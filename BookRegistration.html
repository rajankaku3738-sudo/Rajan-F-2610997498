<!DOCTYPE html>
<html>
<head>
    <title>Readers’ Haven – Book Registration & Order Form</title>
</head>
<body>

    <h2>Readers’ Haven – Book Registration & Order Form</h2>

    <form action="/submit-order" target="_self">


        <input type="hidden" name="form_type" value="Readers Haven Book Order">

        <h3>Personal Information</h3>

        <p>
            <label for="customer_name">Customer Name:</label><br>
            <input type="text" id="customer_name" name="customer_name" placeholder="Enter your full name" required>
        </p>

        <p>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </p>

        <p>
            <label for="mobile">Mobile Number:</label><br>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required>
        </p>

        <p>
            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" min="1">
        </p>

        <p>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required>
        </p>


        <h3>Book Preferences & Order Details</h3>

        <p>
            <label for="category">Favorite Book Category:</label><br>
            <select id="category" name="category" required>
                <option value="">--Select Category--</option>
                <option value="Fiction">Fiction</option>
                <option value="Science">Science</option>
                <option value="History">History</option>
                <option value="Children’s Books">Children’s Books</option>
            </select>
        </p>

        <p>
            <label for="book_title">Book Title:</label><br>
            <input type="text" id="book_title" name="book_title" placeholder="Enter book title" required>
        </p>
        <p>
            <label for="quantity">Quantity:</label><br>
            <input type="number" id="quantity" name="quantity" min="1" value="1" required>
        </p>


        <h3>Payment Details & Delivery Instructions</h3>

        <p>
            <label>Preferred Payment Method:</label><br>
            <input type="radio" id="cod" name="payment_method" value="Cash on Delivery" required>
            <label for="cod">Cash on Delivery</label><br>
            <input type="radio" id="online" name="payment_method" value="Online Payment">
            <label for="online">Online Payment</label>
        </p>

        <p>
            <label for="delivery_date">Delivery Date:</label><br>
            <input type="date" id="delivery_date" name="delivery_date" required>
        </p>
        <p>
            <label for="delivery_time">Preferred Delivery Time:</label><br>
            <input type="time" id="delivery_time" name="delivery_time" required>
        </p>

        <p>
            <label>Additional Services:</label><br>
            <input type="checkbox" id="srv1" name="additional_services" value="Gift Wrapping">
            <label for="srv1">Gift Wrapping</label><br>
            <input type="checkbox" id="srv2" name="additional_services" value="Bookmark">
            <label for="srv2">Bookmark</label><br>
            <input type="checkbox" id="srv3" name="additional_services" value="Express Delivery">
            <label for="srv3">Express Delivery</label><br>
            <input type="checkbox" id="srv4" name="additional_services" value="Greeting Card">
            <label for="srv4">Greeting Card</label>
        </p>

        <p>
            <label for="address">Delivery Address & Special Instructions:</label><br>
            <textarea id="address" name="address" rows="4" placeholder="Enter your delivery address and any special instructions" required></textarea>
        </p>


        <h3>Additional Information</h3>

        <p>
            <label for="reference_doc">Upload Reference Image/Document:</label><br>
            <input type="file" id="reference_doc" name="reference_doc" accept=".jpg, .jpeg, .png, .pdf">
        </p>

        <p>
            <button type="submit">Submit Order</button>
            <button type="reset">Reset Form</button>
        </p>

    </form>

</body>
</html>
